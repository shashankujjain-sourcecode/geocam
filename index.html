
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoTag Camera</title>

<script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        text-align: center;
        padding: 15px;
        margin: 0;
    }

    h2 {
        margin-bottom: 15px;
    }

    video {
        width: 100%;
        max-width: 500px;
        background: black;
        border-radius: 10px;
    }

    button {
        padding: 13px 18px;
        margin: 8px 4px;
        border: none;
        border-radius: 6px;
        background: #1769aa;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #capture {
        background: #198754;
    }

    #download {
        background: #333;
        display: none;
    }

    canvas {
        display: none;
    }

    #status {
        margin: 12px;
        font-size: 14px;
    }

    img {
        width: 100%;
        max-width: 500px;
        margin-top: 15px;
        border-radius: 8px;
    }
</style>
</head>

<body>

<h2>GeoTag Camera</h2>

<video id="video" autoplay playsinline></video>

<br>

<button id="switchCamera">Switch to Front Camera</button>

<br>

<button id="capture">Capture Photo</button>

<br>

<div id="status">Starting camera...</div>

<canvas id="canvas"></canvas>

<img id="preview" alt="Captured photograph">

<br>

<button id="download">Download GeoTagged Photo</button>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const preview = document.getElementById("preview");
const downloadButton = document.getElementById("download");
const switchButton = document.getElementById("switchCamera");

let stream = null;
let currentFacingMode = "environment";
let photoData = null;


// START CAMERA

async function startCamera() {

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: currentFacingMode }
            },
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        switchButton.textContent =
            currentFacingMode === "environment"
            ? "Switch to Front Camera"
            : "Switch to Back Camera";

        statusText.textContent = "Camera ready. Capture your photo.";

    } catch (error) {

        statusText.textContent =
            "Camera unavailable. Please allow camera permission.";

    }
}


// SWITCH FRONT / BACK CAMERA

switchButton.addEventListener("click", async () => {

    currentFacingMode =
        currentFacingMode === "environment"
        ? "user"
        : "environment";

    await startCamera();

});


// CONVERT DECIMAL COORDINATES TO EXIF DMS

function decimalToDMS(decimal) {

    const absolute = Math.abs(decimal);

    const degrees = Math.floor(absolute);
    const minutesFull = (absolute - degrees) * 60;
    const minutes = Math.floor(minutesFull);
    const seconds = (minutesFull - minutes) * 60;

    return [
        [degrees, 1],
        [minutes, 1],
        [Math.round(seconds * 10000), 10000]
    ];

}


// CAPTURE PHOTO AND GPS

document.getElementById("capture").addEventListener("click", () => {

    if (!video.videoWidth || !video.videoHeight) {
        statusText.textContent = "Camera is not ready. Please wait.";
        return;
    }

    statusText.textContent = "Getting current GPS location...";

    if (!navigator.geolocation) {
        statusText.textContent = "GPS is not supported by this browser.";
        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const now = new Date();

            const dateTime =
                now.getFullYear() + ":" +
                String(now.getMonth() + 1).padStart(2, "0") + ":" +
                String(now.getDate()).padStart(2, "0") + " " +
                String(now.getHours()).padStart(2, "0") + ":" +
                String(now.getMinutes()).padStart(2, "0") + ":" +
                String(now.getSeconds()).padStart(2, "0");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const width = canvas.width;
            const height = canvas.height;

            // Draw camera image
            ctx.drawImage(video, 0, 0, width, height);

            // Geo-tag watermark
            const fontSize = Math.max(16, width * 0.027);
            const lineGap = fontSize * 1.55;
            const bandHeight = Math.max(180, lineGap * 5 + 30);

            ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
            ctx.fillRect(0, height - bandHeight, width, bandHeight);

            ctx.fillStyle = "white";
            ctx.font = "bold " + fontSize + "px Arial";
            ctx.textBaseline = "top";

            const left = 20;
            const top = height - bandHeight + 15;

            ctx.fillText(
                "GPS: " + latitude.toFixed(6) + ", " +
                longitude.toFixed(6),
                left, top
            );

            ctx.font = fontSize + "px Arial";

            ctx.fillText(
                "Date & Time: " + dateTime,
                left, top + lineGap
            );

            ctx.fillText(
                "GPS Accuracy: " + Math.round(accuracy) + " metres",
                left, top + lineGap * 2
            );

            ctx.fillText(
                "Coordinates captured at photo time",
                left, top + lineGap * 3
            );

            // APP CREDIT LINE
            ctx.font = "bold " + fontSize + "px Arial";

            ctx.fillText(
                "App created by Shashank Sharma",
                left, top + lineGap * 4
            );

            // Create JPEG
            const jpegData = canvas.toDataURL("image/jpeg", 0.95);

            try {

                // EMBED EXIF GPS METADATA
                const zeroth = {};
                const exif = {};
                const gps = {};

                zeroth[piexif.ImageIFD.DateTime] = dateTime;

                exif[piexif.ExifIFD.DateTimeOriginal] = dateTime;
                exif[piexif.ExifIFD.DateTimeDigitized] = dateTime;

                gps[piexif.GPSIFD.GPSLatitudeRef] =
                    latitude >= 0 ? "N" : "S";

                gps[piexif.GPSIFD.GPSLatitude] =
                    decimalToDMS(latitude);

                gps[piexif.GPSIFD.GPSLongitudeRef] =
                    longitude >= 0 ? "E" : "W";

                gps[piexif.GPSIFD.GPSLongitude] =
                    decimalToDMS(longitude);

                gps[piexif.GPSIFD.GPSDateStamp] =
                    dateTime.substring(0, 10);

                gps[piexif.GPSIFD.GPSTimeStamp] = [
                    [now.getUTCHours(), 1],
                    [now.getUTCMinutes(), 1],
                    [now.getUTCSeconds(), 1]
                ];

                const exifData = {
                    "0th": zeroth,
                    "Exif": exif,
                    "GPS": gps
                };

                const exifBytes = piexif.dump(exifData);

                photoData = piexif.insert(exifBytes, jpegData);

                preview.src = photoData;
                downloadButton.style.display = "inline-block";

                statusText.textContent =
                    "Geo-tagged photo captured successfully.";

            } catch (error) {

                photoData = jpegData;

                preview.src = photoData;
                downloadButton.style.display = "inline-block";

                statusText.textContent =
                    "Photo captured with visible GPS watermark. EXIF metadata could not be embedded.";

            }

        },

        error => {

            statusText.textContent =
                "Unable to get GPS. Enable location permission and try again.";

        },

        {
            enableHighAccuracy: true,
            timeout: 25000,
            maximumAge: 0
        }

    );

});


// DOWNLOAD PHOTO

downloadButton.addEventListener("click", () => {

    if (!photoData) return;

    const link = document.createElement("a");

    link.href = photoData;
    link.download = "GeoTagged_Photo_" + Date.now() + ".jpg";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

});


// INITIALIZE CAMERA

startCamera();

</script>

</body>
</html>
