
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoTag Photo</title>

<style>
body {
    margin: 0;
    padding: 18px;
    background: #f2f6f3;
    font-family: Arial, sans-serif;
    text-align: center;
}
h2 { color: #176b58; }
video, #photo {
    width: 100%;
    max-width: 500px;
    border-radius: 12px;
    background: #111;
}
button {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 12px auto;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #176b58;
    color: white;
    font-size: 16px;
    font-weight: bold;
}
#photo { display: none; }
#status {
    margin: 15px auto;
    max-width: 500px;
    line-height: 1.5;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
</head>

<body>

<h2>GeoTag Photo</h2>
<p>Capture photos with automatic GPS location.</p>

<video id="camera" autoplay playsinline muted></video>

<button id="start">OPEN CAMERA</button>

<button id="capture" disabled>TAKE GEO-TAGGED PHOTO</button>

<div id="status">Ready to capture.</div>

<img id="photo" alt="Geo-tagged photo">

<button id="download" style="display:none">
DOWNLOAD PHOTO
</button>

<canvas id="canvas" hidden></canvas>

<script>

const camera = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");
const statusBox = document.getElementById("status");

let stream = null;
let photoURL = null;

function pad(n) {
    return String(n).padStart(2,"0");
}

function dateFormat(d) {
    return d.getFullYear()+":"+
    pad(d.getMonth()+1)+":"+
    pad(d.getDate())+" "+
    pad(d.getHours())+":"+
    pad(d.getMinutes())+":"+
    pad(d.getSeconds());
}

function gpsDate(d) {
    return d.getUTCFullYear()+":"+
    pad(d.getUTCMonth()+1)+":"+
    pad(d.getUTCDate());
}

function toDMS(value) {
    const a = Math.abs(value);
    const deg = Math.floor(a);
    const minFloat = (a-deg)*60;
    const min = Math.floor(minFloat);
    const sec = (minFloat-min)*60;

    return [
        [deg,1],
        [min,1],
        [Math.round(sec*10000),10000]
    ];
}

function gpsLocation() {
    return new Promise((resolve,reject) => {
        navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
                enableHighAccuracy:true,
                timeout:25000,
                maximumAge:0
            }
        );
    });
}

// OPEN CAMERA

document.getElementById("start").onclick =
async function() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {ideal:"environment"}
            },
            audio:false
        });

        camera.srcObject = stream;

        await camera.play();

        document.getElementById("capture").disabled = false;

        statusBox.textContent = "Camera ready.";

    } catch(e) {

        statusBox.textContent = "Camera error: "+e.message;

    }

};

// CAPTURE PHOTO

document.getElementById("capture").onclick =
async function() {

    const button = document.getElementById("capture");

    button.disabled = true;

    statusBox.textContent = "Getting GPS location...";

    try {

        if(!window.piexif) {
            throw new Error("EXIF library unavailable. Check internet.");
        }

        const position = await gpsLocation();

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        const now = new Date();

        const width = camera.videoWidth;
        const height = camera.videoHeight;

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(camera,0,0,width,height);

        // LOCATION WATERMARK

        const band = Math.max(125,height*0.18);

        ctx.fillStyle = "rgba(0,0,0,0.75)";

        ctx.fillRect(0,height-band,width,band);

        ctx.fillStyle = "white";

        ctx.font = "bold 23px Arial";

        ctx.fillText(
            "GEO-TAG PHOTO",
            20,
            height-band+30
        );

        ctx.font = "18px Arial";

        ctx.fillText(
            "Latitude: "+lat.toFixed(6),
            20,
            height-band+60
        );

        ctx.fillText(
            "Longitude: "+lon.toFixed(6),
            20,
            height-band+88
        );

        ctx.fillText(
            "Accuracy: +/- "+Math.round(accuracy)+" metres",
            20,
            height-band+115
        );

        ctx.fillText(
            now.toLocaleString(),
            20,
            height-band+140
        );

        // CREATE JPEG

        const baseImage = canvas.toDataURL("image/jpeg",0.95);

        // EMBED GPS INTO EXIF

        const exif = {

            "0th": {
                [piexif.ImageIFD.DateTime]:dateFormat(now),
                [piexif.ImageIFD.Software]:"GeoTag Photo"
            },

            "Exif": {
                [piexif.ExifIFD.DateTimeOriginal]:dateFormat(now),
                [piexif.ExifIFD.DateTimeDigitized]:dateFormat(now)
            },

            "GPS": {

                [piexif.GPSIFD.GPSVersionID]:[2,3,0,0],

                [piexif.GPSIFD.GPSLatitudeRef]:
                    lat>=0?"N":"S",

                [piexif.GPSIFD.GPSLatitude]:
                    toDMS(lat),

                [piexif.GPSIFD.GPSLongitudeRef]:
                    lon>=0?"E":"W",

                [piexif.GPSIFD.GPSLongitude]:
                    toDMS(lon),

                [piexif.GPSIFD.GPSDateStamp]:
                    gpsDate(now),

                [piexif.GPSIFD.GPSTimeStamp]:[
                    [now.getUTCHours(),1],
                    [now.getUTCMinutes(),1],
                    [now.getUTCSeconds(),1]
                ]

            }

        };

        const exifBytes = piexif.dump(exif);

        const finalImage = piexif.insert(
            exifBytes,
            baseImage
        );

        const binary = atob(finalImage.split(",")[1]);

        const bytes = new Uint8Array(binary.length);

        for(let i=0;i<binary.length;i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        const blob = new Blob(
            [bytes],
            {type:"image/jpeg"}
        );

        if(photoURL) URL.revokeObjectURL(photoURL);

        photoURL = URL.createObjectURL(blob);

        photo.src = photoURL;

        photo.style.display = "block";

        document.getElementById("download").style.display = "block";

        statusBox.textContent =
            "Photo captured successfully with GPS EXIF metadata.";

    } catch(e) {

        statusBox.textContent = "Error: "+e.message;

    } finally {

        button.disabled = false;

    }

};

// DOWNLOAD PHOTO

document.getElementById("download").onclick =
function() {

    if(!photoURL) return;

    const a = document.createElement("a");

    a.href = photoURL;

    a.download = "GeoTag_"+Date.now()+".jpg";

    a.click();

};

window.addEventListener("beforeunload",function() {

    if(stream) {
        stream.getTracks().forEach(t=>t.stop());
    }

    if(photoURL) URL.revokeObjectURL(photoURL);

});

</script>

</body>
</html>
