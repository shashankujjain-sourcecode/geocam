
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoTag Camera</title>

<!-- EXIF metadata library -->
<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    text-align: center;
    padding: 15px;
    margin: 0;
}

h2 {
    margin: 12px 0 18px;
}

.camera-container {
    max-width: 650px;
    margin: auto;
}

video, #preview {
    width: 100%;
    display: block;
    border-radius: 10px;
    background: #000;
}

button {
    padding: 13px 18px;
    margin: 8px 4px;
    border: none;
    border-radius: 7px;
    background: #1769aa;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#capture {
    background: #198754;
}

#download {
    background: #333;
    display: none;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    max-width: 650px;
    margin: 15px auto;
    padding: 12px;
    background: white;
    border-radius: 7px;
    font-size: 14px;
    line-height: 1.5;
}

#preview {
    display: none;
    margin-top: 15px;
}

canvas {
    display: none;
}
</style>
</head>

<body>

<h2>GeoTag Camera</h2>

<div class="camera-container">

    <video id="video" autoplay playsinline muted></video>

    <div>
        <button id="switchCamera">Switch to Front Camera</button>
    </div>

    <div>
        <button id="capture">Capture Photo</button>
    </div>

    <div id="status">Starting camera...</div>

    <canvas id="canvas"></canvas>

    <img id="preview" alt="GeoTagged photograph">

    <button id="download">Download GeoTagged Photo</button>

</div>

<script>

// ------------------------------------
// ELEMENTS
// ------------------------------------

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const preview = document.getElementById("preview");

const captureButton = document.getElementById("capture");
const switchButton = document.getElementById("switchCamera");
const downloadButton = document.getElementById("download");

let stream = null;
let currentFacingMode = "environment";
let photoData = null;


// ------------------------------------
// START CAMERA
// ------------------------------------

async function startCamera() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        statusText.textContent =
            "Camera access requires HTTPS or localhost. Please open the app through a secure website.";

        return;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    statusText.textContent = "Opening camera...";

    try {

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: {
                    ideal: currentFacingMode
                }
            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        switchButton.textContent =
            currentFacingMode === "environment"
            ? "Switch to Front Camera"
            : "Switch to Back Camera";

        statusText.textContent =
            "Camera ready. You can capture your photograph.";

    } catch (error) {

        console.error("Camera error:", error);

        statusText.textContent =
            "Camera error: " + error.message +
            ". Check camera permission and close other apps using the camera.";

    }
}


// ------------------------------------
// SWITCH CAMERA
// ------------------------------------

switchButton.addEventListener("click", async function() {

    currentFacingMode =
        currentFacingMode === "environment"
        ? "user"
        : "environment";

    await startCamera();

});


// ------------------------------------
// DECIMAL GPS TO EXIF FORMAT
// ------------------------------------

function decimalToDMS(decimal) {

    const absolute = Math.abs(decimal);

    const degrees = Math.floor(absolute);

    const minutesFull = (absolute - degrees) * 60;

    const minutes = Math.floor(minutesFull);

    const seconds = (minutesFull - minutes) * 60;

    return [
        [degrees, 1],
        [minutes, 1],
        [Math.round(seconds * 10000), 10000]
    ];

}


// ------------------------------------
// DATE AND TIME
// ------------------------------------

function getDateTime(date) {

    return (
        date.getFullYear() + ":" +
        String(date.getMonth() + 1).padStart(2, "0") + ":" +
        String(date.getDate()).padStart(2, "0") + " " +
        String(date.getHours()).padStart(2, "0") + ":" +
        String(date.getMinutes()).padStart(2, "0") + ":" +
        String(date.getSeconds()).padStart(2, "0")
    );

}


// ------------------------------------
// DRAW GEO-TAG WATERMARK
// ------------------------------------

function drawWatermark(latitude, longitude, accuracy, dateTime) {

    const width = canvas.width;
    const height = canvas.height;

    const fontSize = Math.max(
        14,
        Math.min(25, width * 0.027)
    );

    const lineGap = fontSize * 1.65;
    const left = 18;
    const maxWidth = width - 36;

    const lines = [

        {
            text: "GPS: " +
                latitude.toFixed(6) + ", " +
                longitude.toFixed(6),
            bold: true
        },

        {
            text: "Date & Time: " + dateTime,
            bold: false
        },

        {
            text: "GPS Accuracy: " +
                Math.round(accuracy) + " metres",
            bold: false
        },

        {
            text: "Coordinates captured at photo time",
            bold: false
        },

        {
            text: "APP DESIGNED AND CREATED BY SHASHANK SHARMA",
            bold: true
        }

    ];

    // Wrap long lines so they fit the photograph

    const displayLines = [];

    lines.forEach(item => {

        const font = item.bold
            ? "bold " + fontSize + "px Arial"
            : fontSize + "px Arial";

        ctx.font = font;

        const words = item.text.split(" ");
        let currentLine = "";

        words.forEach(word => {

            const testLine = currentLine
                ? currentLine + " " + word
                : word;

            if (
                ctx.measureText(testLine).width > maxWidth &&
                currentLine
            ) {

                displayLines.push({
                    text: currentLine,
                    bold: item.bold
                });

                currentLine = word;

            } else {

                currentLine = testLine;

            }

        });

        if (currentLine) {

            displayLines.push({
                text: currentLine,
                bold: item.bold
            });

        }

    });


    const padding = 15;

    const bandHeight =
        displayLines.length * lineGap + padding * 2;

    const top = Math.max(0, height - bandHeight);

    // Black background

    ctx.fillStyle = "rgba(0, 0, 0, 0.88)";

    ctx.fillRect(
        0,
        top,
        width,
        height - top
    );

    // Watermark text

    ctx.textBaseline = "top";

    displayLines.forEach((item, index) => {

        ctx.fillStyle = "#FFFFFF";

        ctx.font = item.bold
            ? "bold " + fontSize + "px Arial"
            : fontSize + "px Arial";

        ctx.fillText(
            item.text,
            left,
            top + padding + index * lineGap
        );

    });

}


// ------------------------------------
// CAPTURE PHOTO
// ------------------------------------

captureButton.addEventListener("click", function() {

    if (!video.videoWidth || !video.videoHeight) {

        statusText.textContent =
            "Camera is not ready. Please wait.";

        return;
    }

    if (!navigator.geolocation) {

        statusText.textContent =
            "Location services are not supported by this browser.";

        return;
    }

    captureButton.disabled = true;
    downloadButton.style.display = "none";

    statusText.textContent =
        "Getting GPS location. Please wait...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            try {

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                const now = new Date();
                const dateTime = getDateTime(now);

                // Capture camera frame

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                // Add watermark

                drawWatermark(
                    latitude,
                    longitude,
                    accuracy,
                    dateTime
                );

                // Convert image to JPEG

                const jpegData = canvas.toDataURL(
                    "image/jpeg",
                    0.95
                );

                photoData = jpegData;

                // Add EXIF GPS information

                try {

                    if (typeof piexif === "undefined") {
                        throw new Error("EXIF library not loaded");
                    }

                    const zeroth = {};
                    const exif = {};
                    const gps = {};

                    zeroth[piexif.ImageIFD.DateTime] = dateTime;

                    exif[piexif.ExifIFD.DateTimeOriginal] = dateTime;

                    exif[piexif.ExifIFD.DateTimeDigitized] = dateTime;

                    gps[piexif.GPSIFD.GPSVersionID] = [2, 3, 0, 0];

                    gps[piexif.GPSIFD.GPSLatitudeRef] =
                        latitude >= 0 ? "N" : "S";

                    gps[piexif.GPSIFD.GPSLatitude] =
                        decimalToDMS(latitude);

                    gps[piexif.GPSIFD.GPSLongitudeRef] =
                        longitude >= 0 ? "E" : "W";

                    gps[piexif.GPSIFD.GPSLongitude] =
                        decimalToDMS(longitude);

                    gps[piexif.GPSIFD.GPSDateStamp] =
                        now.getUTCFullYear() + ":" +
                        String(now.getUTCMonth() + 1).padStart(2, "0") + ":" +
                        String(now.getUTCDate()).padStart(2, "0");

                    gps[piexif.GPSIFD.GPSTimeStamp] = [

                        [now.getUTCHours(), 1],
                        [now.getUTCMinutes(), 1],
                        [now.getUTCSeconds(), 1]

                    ];

                    const exifData = {
                        "0th": zeroth,
                        "Exif": exif,
                        "GPS": gps
                    };

                    const exifBytes = piexif.dump(exifData);

                    photoData = piexif.insert(
                        exifBytes,
                        jpegData
                    );

                } catch (exifError) {

                    console.error("EXIF error:", exifError);

                    statusText.textContent =
                        "Photo captured. GPS watermark added, but EXIF metadata could not be embedded.";

                }

                // Display photo

                preview.src = photoData;
                preview.style.display = "block";

                downloadButton.style.display = "inline-block";

                statusText.textContent =
                    "Photo captured successfully. GPS accuracy: " +
                    Math.round(accuracy) +
                    " metres. " +
                    (accuracy > 50
                        ? "Location is approximate; try outdoors for better accuracy."
                        : "Good GPS reading.");

            } catch (error) {

                console.error("Capture error:", error);

                statusText.textContent =
                    "Photo processing failed: " + error.message;

            }

            captureButton.disabled = false;

        },

        function(error) {

            captureButton.disabled = false;

            let message = "Unable to get GPS location.";

            if (error.code === 1) {
                message = "Location permission denied. Allow location access in your browser.";
            }

            if (error.code === 2) {
                message = "Your device could not determine its location. Check location services.";
            }

            if (error.code === 3) {
                message = "GPS request timed out. Move outdoors and try again.";
            }

            statusText.textContent = message;

        },

        {
            enableHighAccuracy: true,
            timeout: 60000,
            maximumAge: 0
        }

    );

});


// ------------------------------------
// DOWNLOAD PHOTO
// ------------------------------------

downloadButton.addEventListener("click", function() {

    if (!photoData) {
        return;
    }

    const link = document.createElement("a");

    link.href = photoData;

    link.download =
        "GeoTagged_Photo_" +
        new Date().getTime() +
        ".jpg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

});


// ------------------------------------
// INITIALIZE APPLICATION
// ------------------------------------

startCamera();

</script>

</body>
</html>
